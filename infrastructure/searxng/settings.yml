use_default_settings: true
general:
  debug: false
  instance_name: "VideoFinder SearXNG"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "pt-BR"
  languages:
    - pt-BR
    - en
    - es
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "videofinder_searxng_ultra_secret_key_change_in_production"
  limiter: false
  image_proxy: true

engines:
  - name: google
    engine: google
    shortcut: go
    disabled: false
  - name: bing
    engine: bing
    shortcut: bi
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: youtube
    engine: youtube
    shortcut: yt
    disabled: false
  - name: vimeo
    engine: vimeo
    shortcut: vm
    disabled: false
  - name: dailymotion
    engine: dailymotion
    shortcut: dm
    disabled: false
  - name: reddit
    engine: reddit
    shortcut: re
    disabled: false

